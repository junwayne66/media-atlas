# VideoForge 本地全栈（docs/architecture/30-system-architecture.md §2.1）。
# 镜像 tag 在供应链任务中再固定 digest（docs/implementation/50-tech-stack.md §13）。
name: videoforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videoforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videoforge}
      POSTGRES_DB: ${POSTGRES_DB:-videoforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-videoforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # 固定 7.2：redis 7.4 起改用 RSALv2/SSPLv1 许可证（见 third_party_manifest.yaml）
    image: redis:7.2-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # AGPL-3.0：仅作为独立容器经 S3 API 使用，隔离等级 L3（docs/20-open-source-landscape.md §3）
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-videoforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-videoforge123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      # auto-setup 脚本默认 DB_PORT=3306（MySQL），必须显式指到 Postgres
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-videoforge}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-videoforge}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      # server 绑定在容器 eth0 IP（auto-setup 默认 BIND_ON_IP），不能探 localhost
      test: ["CMD-SHELL", "nc -z \"$$(hostname)\" 7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      VIDEOFORGE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-videoforge}:${POSTGRES_PASSWORD:-videoforge}@postgres:5432/${POSTGRES_DB:-videoforge}
      VIDEOFORGE_TEMPORAL_ADDRESS: temporal:7233
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "uvicorn",
        "videoforge_api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # UI 工程师交付的 Web 控制台（media-atlas-app，独立 npm 项目）：
  # 构建成静态资源由 nginx 托管，/api 同源反代到 api 服务（无 CORS）。
  console:
    build:
      context: .
      dockerfile: infra/docker/console.Dockerfile
    ports:
      - "${CONSOLE_PORT:-8080}:80"
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
