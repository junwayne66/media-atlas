[project]
name = "videoforge-api"
version = "0.0.1"
description = "VideoForge 控制平面 API（FastAPI 模块化单体）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "videoforge-workflows",
    "videoforge-persistence",
    "videoforge-domain",
    "videoforge-provider-sdk",
    "videoforge-media-core",
    # 下载连接器：默认构造即「未配置」（不触网），只为把可解释的 attempts 轨迹交给 UI
    "videoforge-connector-yt-dlp",
    "videoforge-connector-f2",
    "temporalio>=1.8",
]

[tool.uv.sources]
videoforge-workflows = { workspace = true }
videoforge-persistence = { workspace = true }
videoforge-domain = { workspace = true }
videoforge-provider-sdk = { workspace = true }
videoforge-media-core = { workspace = true }
videoforge-connector-yt-dlp = { workspace = true }
videoforge-connector-f2 = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_api"]
