[project]
name = "videoforge-api"
version = "0.0.1"
description = "VideoForge 控制平面 API（FastAPI 模块化单体）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "videoforge-workflows",
    "temporalio>=1.8",
]

[tool.uv.sources]
videoforge-workflows = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_api"]
