[project]
name = "videoforge-temporal-worker"
version = "0.1.0"
description = "VideoForge Temporal Worker 进程：注册核心队列的 Workflow 与轻 Activity"
requires-python = ">=3.11"
dependencies = [
    "videoforge-workflows",
]

[tool.uv.sources]
videoforge-workflows = { workspace = true }

[project.scripts]
videoforge-temporal-worker = "videoforge_temporal_worker.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_temporal_worker"]
