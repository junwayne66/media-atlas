[package]
name = "videoforge-desktop"
version = "0.1.0"
description = "VideoForge 桌面壳：Edge Agent Sidecar 生命周期管理 + macOS Keychain 凭据 Broker"
edition = "2021"
license = "MIT"

[lib]
name = "videoforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native"] }
libc = "0.2"
