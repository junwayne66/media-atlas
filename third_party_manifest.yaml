# 第三方依赖与许可证清单（docs/20-open-source-landscape.md §3 的隔离等级）：
#   L0 宽松许可证可入核心 | L1 代码宽松但模型/资源另核 | L2 特殊商业许可证
#   L3 GPL/AGPL 独立进程隔离 | L4 非官方接口需熔断
# 新增外部工具/镜像/模型前先在此登记（docs/implementation/52-repo-structure.md §5）。
# CI 后续任务补充 SBOM 生成与版本 digest 固定。

python:
  - name: fastapi
    license: MIT
    isolation: L0
    used_by: apps/api
  - name: uvicorn
    license: BSD-3-Clause
    isolation: L0
    used_by: apps/api
  - name: pydantic
    license: MIT
    isolation: L0
    used_by: apps/api
  - name: pydantic-settings
    license: MIT
    isolation: L0
    used_by: apps/api
  - name: ruff
    license: MIT
    isolation: L0
    used_by: dev
  - name: pytest
    license: MIT
    isolation: L0
    used_by: dev
  - name: httpx
    license: BSD-3-Clause
    isolation: L0
    used_by: dev
  - name: hatchling
    license: MIT
    isolation: L0
    used_by: apps/api（构建后端）
  - name: sqlalchemy
    license: MIT
    isolation: L0
    used_by: packages/persistence
  - name: alembic
    license: MIT
    isolation: L0
    used_by: packages/persistence, migrations/
  - name: psycopg
    license: LGPL-3.0
    isolation: L1
    used_by: packages/persistence
    note: 仅作为未修改的依赖库 import 使用，不复制/修改其代码
  - name: uuid6
    license: MIT
    isolation: L0
    used_by: packages/persistence
  - name: testcontainers
    license: Apache-2.0
    isolation: L0
    used_by: dev（集成测试）

