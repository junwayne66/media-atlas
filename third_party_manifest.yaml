container_images:
  - name: postgres:16-alpine
    license: PostgreSQL License
    isolation: L0
    used_by: compose.postgres
  - name: redis:7.2-alpine
    license: BSD-3-Clause
    isolation: L0
    used_by: compose.redis
    note: 固定 7.2；redis 7.4+ 改为 RSALv2/SSPLv1，升级前需重新评审
  - name: minio/minio
    license: AGPL-3.0
    isolation: L3
    used_by: compose.minio
    note: 仅作为独立容器经 S3 API 使用，不链接、不修改、不分发其代码
  - name: temporalio/auto-setup
    license: MIT
    isolation: L0
    used_by: compose.temporal
  - name: temporalio/ui
    license: MIT
    isolation: L0
    used_by: compose.temporal-ui
  - name: python:3.11-slim
    license: PSF-2.0（基础镜像含多种组件许可证）
    isolation: L0
    used_by: infra/docker/api.Dockerfile
  - name: node:22-alpine
    license: MIT（Node.js）
    isolation: L0
    used_by: infra/docker/web.Dockerfile
