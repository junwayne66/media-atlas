# 第三方依赖与许可证清单（docs/20-open-source-landscape.md §3 的隔离等级）：
#   L0 宽松许可证可入核心 | L1 代码宽松但模型/资源另核 | L2 特殊商业许可证
#   L3 GPL/AGPL 独立进程隔离 | L4 非官方接口需熔断
# 新增外部工具/镜像/模型前先在此登记（docs/implementation/52-repo-structure.md §5）。
# CI 后续任务补充 SBOM 生成与版本 digest 固定。

python:
  - name: fastapi
    license: MIT
    isolation: L0
    used_by: apps/api
  - name: uvicorn
    license: BSD-3-Clause
    isolation: L0
    used_by: apps/api
  - name: pydantic
    license: MIT
    isolation: L0
    used_by: apps/api
  - name: pydantic-settings
    license: MIT
    isolation: L0
    used_by: apps/api
  - name: ruff
    license: MIT
    isolation: L0
    used_by: dev
  - name: pytest
    license: MIT
    isolation: L0
    used_by: dev
  - name: httpx
    license: BSD-3-Clause
    isolation: L0
    used_by: dev
  - name: hatchling
    license: MIT
    isolation: L0
    used_by: apps/api（构建后端）
  - name: sqlalchemy
    license: MIT
    isolation: L0
    used_by: packages/persistence
  - name: alembic
    license: MIT
    isolation: L0
    used_by: packages/persistence, migrations/
  - name: psycopg
    license: LGPL-3.0
    isolation: L1
    used_by: packages/persistence
    note: 仅作为未修改的依赖库 import 使用，不复制/修改其代码
  - name: uuid6
    license: MIT
    isolation: L0
    used_by: packages/persistence
  - name: testcontainers
    license: Apache-2.0
    isolation: L0
    used_by: dev（集成测试）
  - name: boto3
    license: Apache-2.0
    isolation: L0
    used_by: packages/media-core
  - name: temporalio（Python SDK）
    license: MIT
    isolation: L0
    used_by: packages/workflows, apps/temporal-worker, apps/api
  - name: pytest-asyncio
    license: Apache-2.0
    isolation: L0
    used_by: dev
  - name: pyyaml
    license: MIT
    isolation: L0
    used_by: packages/provider-sdk（descriptor 加载）
  - name: ffmpeg/ffprobe（系统二进制）
    license: LGPL-2.1+ / GPL-2.0+（视构建选项，Homebrew 构建含 GPL 组件）
    isolation: L3
    used_by: packages/media-core（仅参数数组子进程调用，不链接不分发）
    note: ToolchainRegistry 落地后记录实际路径/版本/buildconf（50 §10）
  - name: yt-dlp（系统二进制，版本锁定 2025.01.15）
    license: Unlicense（公共领域等价）
    isolation: L4
    used_by: connectors/downloaders/yt-dlp（DownloadProvider）
    note: >
      本体 Unlicense 可入核心，但对平台的提取属非官方接口用途按 L4 管理：仅参数数组
      子进程调用（不链接不分发），实时下载默认未启用（需真实二进制+真实资源，停止条件），
      Cookie 走不透明 credential_handle，验证码/风控转人工不绕过。版本升级须重跑连接器契约测试。

