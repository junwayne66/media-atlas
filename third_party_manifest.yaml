# 第三方依赖与许可证清单（docs/20-open-source-landscape.md §3 的隔离等级）：
#   L0 宽松许可证可入核心 | L1 代码宽松但模型/资源另核 | L2 特殊商业许可证
#   L3 GPL/AGPL 独立进程隔离 | L4 非官方接口需熔断
# 新增外部工具/镜像/模型前先在此登记（docs/implementation/52-repo-structure.md §5）。
# CI 后续任务补充 SBOM 生成与版本 digest 固定。

