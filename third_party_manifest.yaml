    isolation: L0
    used_by: dev
  - name: pyyaml
    license: MIT
    isolation: L0
    used_by: packages/provider-sdk（descriptor 加载）
  - name: ffmpeg/ffprobe（系统二进制）
    license: LGPL-2.1+ / GPL-2.0+（视构建选项，Homebrew 构建含 GPL 组件）
    isolation: L3
    used_by: >
      packages/media-core：ffprobe 探测、视频指纹抽帧（VF-107）、媒体运行时 proxy/audio/
      scene（VF-201）——全部仅参数数组子进程调用，不链接不分发。
    note: >
      工具版本由 FfmpegRuntime 构造时探测并写入每个操作的 JobManifest（可重放）。
      真实人脸检测模型（OpenCV/DNN）尚未选型，FaceDetector 端口默认 Null/Fake，接入留到 P2 后段。
      ToolchainRegistry 落地后记录实际路径/版本/buildconf（50 §10）。
  - name: yt-dlp（系统二进制，版本锁定 2025.01.15）
    license: Unlicense（公共领域等价）
    isolation: L4
    used_by: connectors/downloaders/yt-dlp（DownloadProvider）
    note: >
      本体 Unlicense 可入核心，但对平台的提取属非官方接口用途按 L4 管理：仅参数数组
      子进程调用（不链接不分发），实时下载默认未启用（需真实二进制+真实资源，停止条件），
      Cookie 走不透明 credential_handle，验证码/风控转人工不绕过。版本升级须重跑连接器契约测试。
  - name: f2（系统二进制，版本锁定 0.0.1.7）
    license: Apache-2.0
    isolation: L4
    used_by: connectors/downloaders/f2（DownloadProvider，抖音优先/TikTok 兜底）
    note: >
      Apache-2.0 但对平台的抓取属非官方接口用途按 L4 管理（同 yt-dlp 处置）：仅参数数组
      子进程调用（不链接不分发），实时下载默认未启用（停止条件），Cookie 走不透明
      credential_handle，验证码/风控转人工不绕过，手工导入始终可用。升级须重跑契约测试。
  - name: chromaprint/fpcalc（系统二进制）
    license: LGPL-2.1+
    isolation: L3
    used_by: 计划——音频声纹指纹（docs/modules/41 §5 去重音频层）
    note: >
      本机未安装，音频指纹层暂缺（VF-107 只落地视频 pHash + 文本 SimHash + 文件 SHA）；
      落地时仅参数数组子进程调用（不链接不分发）。去重引擎已预留 AUDIO 层，接入即生效。
  - name: whisper.cpp / faster-whisper / WhisperX / FunASR（ASR 引擎与模型）
    license: MIT / MIT / BSD-2-Clause / MIT（模型权重许可另计）
    isolation: L1
    used_by: 计划——ASR Provider（docs/modules/41 §7）
    note: >
      VF-202 只落地统一词级 Transcript 合同 + ASR 端口 + Fake/路由（录制 fixture 回放）；
      真实引擎需下载模型权重（停止条件，权重许可另核），默认 UnconfiguredASRProvider 返回
      UNCONFIGURED 不静默假装。接入时代码宽松许可可入核心，模型权重按 L1 单独评审。
  - name: PaddleOCR / RapidOCR（OCR 引擎与中英识别模型）
    license: Apache-2.0（模型权重许可另计）
    isolation: L1
    used_by: 计划——OCR Provider（docs/modules/41 §8）
    note: >
      VF-203 只落地 TextTrack 合同 + OCR 端口 + Fake（录制检测回放）+ domain 跟踪/多帧投票/
      类型分类（纯）；真实引擎需模型权重（停止条件），默认 UnconfiguredOCRProvider 返回
      UNCONFIGURED 不静默假装。接入时代码宽松许可可入核心，模型权重按 L1 单独评审。
  - name: VLM（Qwen-VL / Claude 视觉 API 或本地 VLM）
    license: 视具体引擎/API（模型权重与 API 条款另核）
    isolation: L2
    used_by: 计划——VLM Provider（docs/modules/41 §9）
    note: >
      VF-204 只落地 VisualAnalysis 合同 + 代表帧选择（纯域，选帧数封顶 max_frames）+ VLM 端口
      + Fake（录制 caption 回放，批量一次调用）。真实引擎需模型/付费 API（停止条件），默认
      UnconfiguredVLMProvider 返回 UNCONFIGURED。成本红线：VLM 只批量分析代表帧，**绝不逐帧
      云调用**——端口 analyze 接整批帧、缓存用 VF-201 activity_cache_key 去重。接入前须评审费用。
  - name: LLM（Blueprint 融合，Claude / Qwen 等 API 或本地 LLM）
    license: 视具体引擎/API（另核）
    isolation: L2
    used_by: 计划——BlueprintFusionProvider（docs/modules/41 §10）
    note: >
      VF-205 只落地 VideoBlueprint 合同 + 候选生成/校验护栏（纯域）+ 融合端口 + Fake。
      真实 LLM 需模型/付费 API（停止条件），默认 UnconfiguredBlueprintFusionProvider 返回
      UNCONFIGURED。护栏：时间范围由程序候选、LLM 不编造时间戳，Claim 必须引用真实证据，
      时间单调/在时长内，覆盖率 ≥0.9——由 domain.validate_blueprint 强制，非法蓝图不下游消费。
  - name: LLM（结构重写，Claude / Qwen 等 API 或本地 LLM）
    license: 视具体引擎/API（另核）
    isolation: L2
    used_by: 计划——StructureRewriteProvider（docs/modules/42 §3）
    note: >
      VF-302 只落地 BeatTemplate/ScriptVersion 合同 + 语速估算/模板缩放/脚本护栏（纯域）+ 改写
      端口 + Fake。真实 LLM 需模型/付费 API（停止条件），默认 UnconfiguredStructureRewriteProvider
      返回 UNCONFIGURED。护栏（domain.validate_script 强制）：只依据节拍功能 + 经核验 Claim 生成
      中性语义脚本，绝不复用原句（text_simhash 比对源转录判抄袭），引用的事实必须在 ClaimTable 且
      非 DISPUTED/不可用，DISPUTED 事实即便 must_cover 也绝不自动引用，总时长≈预算，禁用词过滤。
  - name: VLM/LLM（热门片段特征评分，Qwen-VL / Claude 等或训练模型）
    license: 视具体引擎/API（另核）
    isolation: L2
    used_by: 计划——HighlightFeatureProvider（docs/modules/42 §5.2）
    note: >
      VF-303 只落地 HighlightCandidate/HighlightWeights 合同 + 候选窗口/加权评分/去重/MMR（纯域）
      + 特征端口 + Fake。11 项特征子分（hook_strength/surprise/emotional_energy…）是模型判断，
      真实实现需 VLM/LLM 或训练模型（停止条件），默认 UnconfiguredHighlightFeatureProvider 返回
      UNCONFIGURED。评分聚合/去重/MMR 是纯域确定性逻辑；predicted_retention 无训练数据时保持 null
      不伪装。候选窗口在句子边界生成，绝不切句。
  - name: 文本分析/VLM（原片重剪句段判定，或训练模型）
    license: 视具体引擎/API（另核）
    isolation: L2
    used_by: 计划——SegmentJudgeProvider（docs/modules/42 §4.1）
    note: >
      VF-304 只落地 ReeditPlan/EditOp 合同 + 重剪规划器/连续性/不切句/变速护栏（纯域）+ 句段判定
      端口 + Fake。判定"哪些句段该删（静音/口头禅/重复/低信息）"是模型判断，真实实现需 ASR 文本
      分析/VLM 或训练模型（停止条件），默认 UnconfiguredSegmentJudgeProvider 返回 UNCONFIGURED。
      计划生成/护栏是纯域确定性逻辑：操作边界不切句、KEEP 不重叠、变速仅在允许区间、每处 jump cut
      都须有连续性处理。

