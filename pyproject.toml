[project]
name = "videoforge"
version = "0.0.1"
description = "VideoForge monorepo workspace root（虚拟包，不构建；成员见 tool.uv.workspace）"
requires-python = ">=3.11"
dependencies = [
    "videoforge-api",
]

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
videoforge-api = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["videoforge_api"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
