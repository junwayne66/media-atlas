[project]
name = "videoforge"
version = "0.0.1"
description = "VideoForge monorepo workspace root（虚拟包，不构建；成员见 tool.uv.workspace）"
requires-python = ">=3.11"
dependencies = [
    "videoforge-api",
    "videoforge-contracts",
    "videoforge-persistence",
    "videoforge-media-core",
    "videoforge-workflows",
    "videoforge-temporal-worker",
    "videoforge-provider-sdk",
    "videoforge-edge-agent",
    "videoforge-domain",
    "videoforge-connector-douyin",
    "videoforge-connector-tiktok",
    "videoforge-connector-yt-dlp",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/temporal-worker",
    "packages/contracts-py",
    "packages/persistence",
    "packages/media-core",
    "packages/workflows",
    "packages/provider-sdk",
    "packages/domain",
    "services/edge-agent",
    "connectors/sources/douyin",
    "connectors/sources/tiktok",
    "connectors/downloaders/yt-dlp",
]

[tool.uv.sources]
videoforge-api = { workspace = true }
videoforge-contracts = { workspace = true }
videoforge-persistence = { workspace = true }
videoforge-media-core = { workspace = true }
videoforge-workflows = { workspace = true }
videoforge-temporal-worker = { workspace = true }
videoforge-provider-sdk = { workspace = true }
videoforge-edge-agent = { workspace = true }
videoforge-domain = { workspace = true }
videoforge-connector-douyin = { workspace = true }
videoforge-connector-tiktok = { workspace = true }
videoforge-connector-yt-dlp = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "httpx>=0.28",
    "testcontainers[postgres,minio]>=4.8",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "videoforge_api",
    "videoforge_contracts",
    "videoforge_persistence",
    "videoforge_media_core",
    "videoforge_workflows",
    "videoforge_temporal_worker",
    "videoforge_provider_sdk",
    "videoforge_edge_agent",
    "videoforge_domain",
    "videoforge_connector_douyin",
    "videoforge_connector_tiktok",
    "videoforge_connector_yt_dlp",
]

[tool.pytest.ini_options]
testpaths = [
    "apps/api/tests",
    "packages/contracts-py/tests",
    "packages/persistence/tests",
    "packages/media-core/tests",
    "packages/workflows/tests",
    "packages/provider-sdk/tests",
    "services/edge-agent/tests",
    "apps/temporal-worker/tests",
    "packages/domain/tests",
    "connectors/sources/douyin/tests",
    "connectors/sources/tiktok/tests",
    "connectors/downloaders/yt-dlp/tests",
]
asyncio_mode = "auto"
