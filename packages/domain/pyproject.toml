[project]
name = "videoforge-domain"
version = "0.1.0"
description = "VideoForge 纯领域逻辑：热点动力学、评分聚合、趋势阶段状态机、reason codes。无框架依赖。"
requires-python = ">=3.11"
dependencies = [
    "videoforge-contracts",
]

[tool.uv.sources]
videoforge-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_domain"]
