[project]
name = "videoforge-persistence"
version = "0.1.0"
description = "VideoForge 持久化层：SQLAlchemy 2 表定义、契约映射、乐观锁 repositories、事务性 outbox"
requires-python = ">=3.11"
dependencies = [
    "videoforge-contracts",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "uuid6>=2024.1",
]

[tool.uv.sources]
videoforge-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_persistence"]
