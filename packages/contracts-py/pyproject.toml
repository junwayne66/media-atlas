[project]
name = "videoforge-contracts"
version = "0.1.0"
description = "VideoForge 核心领域合同：Pydantic 编写真值，导出 schemas/ 下的 JSON Schema 规范文件"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "uuid6>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_contracts"]
