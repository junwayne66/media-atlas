[project]
name = "videoforge-media-core"
version = "0.1.0"
description = "VideoForge 媒体核心：对象存储 Artifact Store、内容寻址本地缓存、流式哈希、ffprobe 探测"
requires-python = ">=3.11"
dependencies = [
    "videoforge-contracts",
    "boto3>=1.35",
]

[tool.uv.sources]
videoforge-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_media_core"]
