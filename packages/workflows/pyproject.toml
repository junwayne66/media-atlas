[project]
name = "videoforge-workflows"
version = "0.1.0"
description = "VideoForge Temporal 工作流定义（骨架：编排决策在 Workflow，I/O 全在 Activity）"
requires-python = ">=3.11"
dependencies = [
    "videoforge-contracts",
    "temporalio>=1.8",
]

[tool.uv.sources]
videoforge-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_workflows"]
