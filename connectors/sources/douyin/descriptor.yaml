# 抖音发现连接器（docs/architecture/30 §9，docs/modules/40 §2.1）
name: source.douyin
provider_type: SourceConnector
version: 0.1.0
capabilities:
  - source.discover
  - source.metadata
execution_location: local
languages:
  - zh-CN
platforms:
  - douyin
# L4：实时路径依赖非官方公开信号，签名/页面高度易变，须健康探针+熔断+人工回退
# （docs/20-open-source-landscape.md §3）。官方开放平台能力优先但需凭据+App 审核。
isolation_level: L4
license_notes: >
  官方开放平台能力优先（需 client_key/secret 与 App 审核）；公开信号适配器为 L4，
  实时抓取未启用；手工导入始终可用。候选实时适配器 f2（Apache-2.0）待授权后接入。
required_secrets:
  - douyin_open_api_client_key
  - douyin_open_api_client_secret
