[project]
name = "videoforge-connector-tiktok"
version = "0.1.0"
description = "TikTok 发现连接器：官方能力优先（需凭据）、L4 公开信号适配器（录制 fixture 打桩）、手工导入回退"
requires-python = ">=3.11"
dependencies = [
    "videoforge-contracts",
    "videoforge-provider-sdk",
]

[tool.uv.sources]
videoforge-contracts = { workspace = true }
videoforge-provider-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_connector_tiktok"]
